services:
  - type: web
    name: pixel-perfect-server
    env: node
    rootDir: ./
    buildCommand: cd client && npm install && npm run build && cd ../server && npm install
    startCommand: cd server && NODE_ENV=production node server.js
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
    disk:
      name: pixel-perfect-data
      mountPath: /opt/render/project/src/server/data
      sizeGB: 1
